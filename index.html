<!DOCTYPE html>
<!-- ema-ucenje: ovu stranicu generira objavi.ps1 -->
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ema – učenje</title>
<style>
:root { --bg:#f6f1e7; --card:#fffdf8; --ink:#1d2433; --muted:#5d6475; --line:#e2d9c6; --accent:#9a3b1f; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#15171c; --card:#1e2128; --ink:#ece7dc; --muted:#a3a8b4; --line:#333844; --accent:#e0885f; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main { max-width:720px; margin:0 auto; padding:32px 16px; }
h1 { font-family:Georgia,serif; font-size:2rem; margin:0 0 4px; }
p { color:var(--muted); margin:0 0 24px; }
.grid { display:grid; gap:12px; }
a.subj {
  display:flex; align-items:center; gap:16px; padding:18px 20px; text-decoration:none; color:var(--ink);
  background:var(--card); border:1px solid var(--line); border-radius:14px;
}
a.subj:hover { border-color:var(--accent); }
a.subj .ico { font-size:1.8rem; }
a.subj b { display:block; font-size:1.1rem; }
a.subj span.d { color:var(--muted); font-size:.92rem; }
</style>
</head>
<body>
<main>
  <h1>Ema – učenje</h1>
  <p>Odaberi predmet.</p>
  <div class="grid">
    <a class="subj" href="povijest/">
      <span class="ico">🏰</span>
      <span><b>Povijest</b><span class="d">Rani srednji vijek – gradivo, kartice, kronologija i kviz</span></span>
    </a>
  </div>
</main>
</body>
</html>
